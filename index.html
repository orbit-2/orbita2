sessions.at(-1).subject))} · ${fmt(db.sessions.at(-1).minutes)}`:'Nenhuma sessão registrada ainda.'}</p></div></div>`}
function taskList(arr,actions=true){return arr.length?`<div class="list">${arr.map(t=>`<div class="item"><input aria-label="Concluir tarefa" class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="details" style="${t.done?'opacity:.55;text-decoration:line-through':''}"><strong>${esc(t.title)}</strong><small>${esc(sub(t.subject))} ${t.due?' · '+esc(t.due):''} · ${esc(t.priority||'Normal')}</small></div>${actions?`<button class="btn tiny ghost" onclick="editTask('${t.id}')">Editar</button><button class="btn tiny danger" onclick="remove('tasks','${t.id}')">×</button>`:''}</div>`).join('')}</div>`:empty('Nada por aqui. Adicione sua primeira tarefa!')}
function tasks(){return `<div class="grid"><div class="card"><h2>Nova tarefa</h2><form class="form" onsubmit="addTask(event)"><label class="span">O que você precisa fazer?<input class="field" name="title" required maxlength="160" placeholder="Ex.: Resolver exercícios de tensores"></label><label>Matéria<select class="field" name="subject">${opts()}</select></label><label>Prioridade<select class="field" name="priority"><option>Normal</option><option>Alta</option><option>Baixa</option></select></label><label>Prazo<input class="field" name="due" type="date"></label><button class="btn span">+ Adicionar tarefa</button></form></div><div class="card wide"><div class="row between"><h2>Minhas tarefas</h2><select class="field" style="width:auto" id="taskfilter" onchange="filterTasks()"><option value="all">Todas</option><option value="open">Pendentes</option><option value="done">Concluídas</option></select></div><div id="tasklist">${taskList(db.tasks)}</div></div></div>`}function filterTasks(){let f=$('#taskfilter').value;$('#tasklist').innerHTML=taskList(db.tasks.filter(t=>f==='all'||(f==='done'?t.done:!t.done)))}function addTask(e){e.preventDefault();let f=new FormData(e.target);db.tasks.unshift({id:id(),title:f.get('title').trim(),subject:f.get('subject'),priority:f.get('priority'),due:f.get('due'),done:false});save();notice('Tarefa adicionada')}function toggleTask(i){let t=db.tasks.find(t=>t.id===i);if(t)t.done=!t.done;save()}function editTask(i){let t=db.tasks.find(t=>t.id===i),v=prompt('Editar tarefa:',t.title);if(v?.trim()){t.title=v.trim();save()}}
function timer(){return `<div class="grid"><div class="card wide"><div class="row between"><h2>◷ Cronômetro de foco</h2><span class="pill" id="status">Pronto para começar</span></div><div class="timer" id="clock">00:00:00</div><div class="form"><label>Matéria<select id="timersub" class="field">${opts()}</select></label><label>Atividade<select id="timerkind" class="field"><option>Leitura teórica</option><option>Exercícios</option><option>Videoaula</option><option>Revisão</option><option>Grupo de estudos</option><option>Pesquisa</option></select></label></div><div class="row" style="justify-content:center;margin-top:22px"><button class="btn" id="startbtn" onclick="startPause()">▶ Iniciar</button><button class="btn ghost" onclick="finishTimer()">■ Salvar sessão</button><button class="btn ghost" onclick="resetTimer()">↺ Zerar</button></div></div><div class="card"><h2>Registro manual</h2><form class="form" onsubmit="manualSession(event)"><label class="span">Matéria<select class="field" name="subject">${opts()}</select></label><label>Minutos<input class="field" name="minutes" type="number" min="1" max="1440" required placeholder="60"></label><label>Data<input class="field" name="date" type="date" value="${today()}" required></label><label class="span">Atividade<input class="field" name="kind" placeholder="Ex.: Lista de exercícios"></label><button class="btn span">Registrar tempo</button></form></div><div class="card full"><h2>Histórico de sessões</h2>${db.sessions.length?`<div class="list">${[...db.sessions].reverse().slice(0,35).map(s=>`<div class="item"><div class="details"><strong>${esc(sub(s.subject))} · ${fmt(s.minutes)}</strong><small>${esc(s.date)} · ${esc(s.kind||'Estudo')}</small></div><button class="btn tiny danger" onclick="remove('sessions','${s.id}')">Excluir</button></div>`).join('')}</div>`:empty('Suas sessões aparecerão aqui.')}</div></div>`}function seconds(){return elapsed+(started?Math.floor((Date.now()-started)/1000):0)}function refreshTimer(){let n=seconds(),el=$('#clock');if(el)el.textContent=[Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(x=>String(x).padStart(2,'0')).join(':');let b=$('#startbtn');if(b)b.textContent=started?'Ⅱ Pausar':'▶ Iniciar';let st=$('#status');if(st)st.textContent=started?'● Em foco':n?'Pausado':'Pronto para começar'}function startPause(){if(started){elapsed=seconds();started=0;clearInterval(ticking)}else{started=Date.now();ticking=setInterval(refreshTimer,500)}refreshTimer()}function resetTimer(){if(seconds()&&!confirm('Zerar o cronômetro sem salvar?'))return;started=0;elapsed=0;clearInterval(ticking);refreshTimer()}function finishTimer(){let n=Math.max(1,Math.round(seconds()/60));if(seconds()<10){notice('Estude por alguns segundos antes de salvar');return}db.sessions.push({id:id(),subject:$('#timersub').value,kind:$('#timerkind').value,date:today(),minutes:n});started=0;elapsed=0;clearInterval(ticking);save();notice('Sessão salva!')}function manualSession(e){e.preventDefault();let f=new FormData(e.target);db.sessions.push({id:id(),subject:f.get('subject'),minutes:Number(f.get('minutes')),date:f.get('date'),kind:f.get('kind')||'Estudo'});save();notice('Tempo registrado')}
function courses(){return `<div class="grid"><div class="card"><h2>Adicionar playlist / curso</h2><form class="form" onsubmit="addCourse(event)"><label class="span">Nome do curso<input name="title" class="field" required placeholder="Ex.: Relatividade Geral — Carroll"></label><label class="span">Link do YouTube<input name="url" class="field" type="url" placeholder="https://www.youtube.com/playlist?list=..."></label><label class="span">Matéria<select name="subject" class="field">${opts()}</select></label><label class="span">Quantidade de aulas (opcional)<input name="count" class="field" type="number" min="0" max="500" placeholder="Ex.: 24"></label><button class="btn span">+ Adicionar curso</button></form><p style="font-size:12px;margin-top:14px">Para uso offline, as aulas são criadas pelo número informado. A lista não é importada automaticamente do YouTube.</p></div><div class="card wide"><h2>Minha biblioteca</h2>${db.courses.length?db.courses.map(c=>`<details class="course"><summary>${esc(c.title)} <span class="pill">${c.lessons.filter(x=>x.done).length}/${c.lessons.length} aulas</span></summary><p>${esc(sub(c.subject))} ${c.url?`· <a href="${esc(safeURL(c.url))}" target="_blank" rel="noopener noreferrer">Abrir no YouTube ↗</a>`:''}</p>${prog(pct(c.lessons.filter(x=>x.done).length,c.lessons.length))}<div class="list">${c.lessons.map(l=>`<div class="item"><input class="check" type="checkbox" ${l.done?'checked':''} onchange="toggleLesson('${c.id}','${l.id}')"><div class="details" style="${l.done?'opacity:.55':''}">${esc(l.title)}</div><button class="btn tiny ghost" onclick="renameLesson('${c.id}','${l.id}')">✎</button><button class="btn tiny danger" onclick="deleteLesson('${c.id}','${l.id}')">×</button></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn tiny ghost" onclick="addLesson('${c.id}')">+ Aula</button><button class="btn tiny danger" onclick="remove('courses','${c.id}')">Excluir curso</button></div></details>`).join(''):empty('Adicione uma playlist para acompanhar as aulas.')}</div></div>`}function safeURL(s){try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}function addCourse(e){e.preventDefault();let f=new FormData(e.target),count=Math.min(500,Math.max(0,Number(f.get('count'))||0));db.courses.push({id:id(),title:f.get('title').trim(),url:f.get('url'),subject:f.get('subject'),lessons:Array.from({length:count},(_,i)=>({id:id(),title:'Aula '+(i+1),done:false}))});save();notice('Curso adicionado')}function toggleLesson(ci,li){let l=db.courses.find(c=>c.id===ci)?.lessons.find(l=>l.id===li);if(l)l.done=!l.done;save()}function addLesson(ci){let c=db.courses.find(c=>c.id===ci),v=prompt('Nome da aula:','Aula '+(c.lessons.length+1));if(v?.trim()){c.lessons.push({id:id(),title:v.trim(),done:false});save()}}function renameLesson(ci,li){let l=db.courses.find(c=>c.id===ci).lessons.find(l=>l.id===li),v=prompt('Nome da aula:',l.title);if(v?.trim()){l.title=v.trim();save()}}function deleteLesson(ci,li){if(confirm('Excluir esta aula?')){let c=db.courses.find(c=>c.id===ci);c.lessons=c.lessons.filter(l=>l.id!==li);save()}}
function subjects(){return `<div class="grid"><div class="card"><h2>Nova matéria</h2><form class="form" onsubmit="addSubject(event)"><label class="span">Nome<input class="field" name="name" required maxlength="80" placeholder="Ex.: Geometria Diferencial"></label><label>Cor<input class="field" name="color" type="color" value="#aa95ff"></label><button class="btn span">+ Adicionar matéria</button></form></div><div class="card wide"><h2>Matérias cadastradas</h2><div class="list">${db.subjects.length?'':empty('Nenhuma matéria cadastrada. Adicione sua primeira matéria acima.')}${db.subjects.map(s=>`<div class="item"><span style="width:13px;height:13px;border-radius:50%;background:${esc(s.color)}"></span><div class="details"><strong>${esc(s.name)}</strong><small>${fmt(sum(db.sessions.filter(x=>x.subject===s.id).map(x=>x.minutes)))}</small></div><button class="btn tiny ghost" onclick="renameSubject('${s.id}')">Editar</button><button class="btn tiny danger" onclick="deleteSubject('${s.id}')">×</button></div>`).join('')}</div></div></div>`}function addSubject(e){e.preventDefault();const form=e.currentTarget||e.target;const name=form.querySelector('[name="name"]')?.value.trim();const color=form.querySelector('[name="color"]')?.value||'#aa95ff';if(!name)return notice('Digite o nome da matéria');if(db.subjects.some(s=>s.name.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR')))return notice('Essa matéria já existe');db.subjects.push({id:id(),name,color});save();notice('Matéria adicionada')}function renameSubject(i){let s=db.subjects.find(s=>s.id===i),v=prompt('Nome da matéria:',s.name);if(v?.trim()){s.name=v.trim();save()}}function deleteSubject(i){if(confirm('Excluir matéria? Os registros antigos permanecerão.')){db.subjects=db.subjects.filter(s=>s.id!==i);save()}}
function notes(){return `<div class="grid"><div class="card"><h2>Nova anotação</h2><form class="form" onsubmit="addNote(event)"><label class="span">Título<input class="field" name="title" required placeholder="Ex.: Ideia para demonstrar um teorema"></label><label class="span">Matéria<select class="field" name="subject">${opts()}</select></label><label class="span">Anotação<textarea class="field" name="body" required placeholder="Escreva sua ideia, dúvida, referência..."></textarea></label><button class="btn span">+ Salvar nota</button></form></div><div class="card wide"><h2>Caderno de bordo</h2><div class="list">${db.notes.length?[...db.notes].reverse().map(n=>`<div class="item"><div class="details"><strong>${esc(n.title)}</strong><small>${esc(sub(n.subject))} · ${esc(n.date)}</small><p style="white-space:pre-wrap;color:var(--text)">${esc(n.body)}</p></div><button class="btn tiny ghost" onclick="editNote('${n.id}')">Editar</button><button class="btn tiny danger" onclick="remove('notes','${n.id}')">×</button></div>`).join(''):empty('Anote aqui suas descobertas e dúvidas.')}</div></div></div>`}function addNote(e){e.preventDefault();let f=new FormData(e.target);db.notes.push({id:id(),title:f.get('title').trim(),subject:f.get('subject'),body:f.get('body').trim(),date:today()});save()}function editNote(i){let n=db.notes.find(n=>n.id===i),v=prompt('Editar anotação:',n.body);if(v!==null){n.body=v;save()}}
function config(){return `<div class="grid"><div class="card wide"><h2>✦ Escolha sua atmosfera</h2><p>Seis temas para combinar com seu estilo.</p><div class="row" style="gap:20px;margin-top:18px">${Object.entries(themes).map(([k,v])=>`<div style="text-align:center"><button aria-label="Tema ${k}" class="theme ${db.theme===k?'selected':''}" style="background:linear-gradient(135deg,${v[0]} 50%,${v[6]} 50%)" onclick="setTheme('${k}')"></button><div><small>${{cosmos:'Cosmos',aurora:'Aurora',sunset:'Pôr do sol',paper:'Papel',ocean:'Oceano',forest:'Floresta'}[k]}</small></div></div>`).join('')}</div></div><div class="card"><h2>Identidade</h2><label>Como quer ser chamado?<input class="field" value="${esc(db.name)}" maxlength="40" onchange="db.name=this.value;save()" placeholder="Seu nome"></label><label style="display:block;margin-top:15px">Meta semanal (horas)<input class="field" type="number" min="1" max="168" value="${db.weekly}" onchange="db.weekly=Math.max(1,Math.min(168,Number(this.value)||15));save()"></label></div><div class="card"><h2>Aparência</h2><label>Arredondamento dos cartões<input style="width:100%;accent-color:var(--accent)" type="range" min="8" max="32" value="${db.radius}" oninput="db.radius=Number(this.value);applyTheme()" onchange="save()"></label><label style="display:block;margin-top:18px">Espaçamento<select class="field" onchange="db.density=Number(this.value);save()"><option value=".8" ${db.density===.8?'selected':''}>Compacto</option><option value="1" ${db.density===1?'selected':''}>Confortável</option><option value="1.2" ${db.density===1.2?'selected':''}>Amplo</option></select></label></div><div class="card wide"><h2>Seus dados</h2><p>Os dados ficam neste navegador e não são sincronizados automaticamente entre dispositivos. Exporte um backup regularmente.</p><div class="row" style="margin-top:16px"><button class="btn" onclick="exportData()">↓ Exportar backup JSON</button><label class="btn ghost" style="cursor:pointer">↑ Importar backup<input type="file" accept=".json,application/json" hidden onchange="importData(event)"></label><button class="btn danger" onclick="clearData()">Apagar todos os dados</button></div></div><div class="card"><h2>Sobre o Órbita</h2><p>Versão 2.0 · Planner pessoal de estudos.</p><p>Feito para acompanhar sua jornada em Física, da matemática básica à geometria do espaço-tempo.</p></div></div>`}function setTheme(t){db.theme=t;save()}function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='orbita-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(e){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.subjects)||!Array.isArray(obj.tasks)||!Array.isArray(obj.sessions)||!Array.isArray(obj.courses)||!Array.isArray(obj.notes))throw Error('Formato inválido');if(confirm('Substituir todos os dados atuais pelo backup?')){db={...defaults,...obj};save();notice('Backup importado')}}catch{alert('Não foi possível ler este backup.')}}function clearData(){if(confirm('Apagar todos os dados do Órbita neste navegador? Esta ação é irreversível.')){db=structuredClone(defaults);save()}}function remove(kind,i){if(confirm('Excluir este registro?')){db[kind]=db[kind].filter(x=>x.id!==i);save()}}render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshTimer()});
</script></body></html>
